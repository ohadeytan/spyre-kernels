[project]
name = "tritokti"
version = "0.1.0"
description = "Triton-to-KTIR kernel porting for vLLM on IBM Spyre"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.4.0",
    "triton>=3.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ktir-cpu",
]

[tool.uv.sources]
ktir-cpu = { git = "https://github.com/torch-spyre/ktir-cpu", rev = "51e54f6fe407a35e8def2ff3443f436b16130949" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernels", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
python_files = ["test_*.py"]
markers = [
    "ktir_cpu: ktir validation test whose reference is CPU-only (no GPU needed)",
]
